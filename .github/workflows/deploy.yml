name: deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run tests
        run: |
          pip install pytest
          mkdir -p test-results
          PYTHONPATH=. pytest tests --junitxml=test-results/results.xml

      - name: ServiceNow DevOps Unit Test Results
        if: always()
        uses: ServiceNow/servicenow-devops-test-report@v6.0.0
        with:
          devops-integration-token: ${{ secrets.SN_DEVOPS_INTEGRATION_TOKEN }}
          instance-url: ${{ secrets.SN_INSTANCE_URL }}
          tool-id: ${{ secrets.SN_ORCHESTRATION_TOOL_ID }}
          context-github: ${{ toJSON(github) }}
          job-name: 'Build'
          xml-report-filename: test-results/results.xml
          test-summary-name: 'GIP-POC-UnitTests'

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: ServiceNow Change
        id: create
        uses: ServiceNow/servicenow-devops-change@v7.1.0
        with:
          devops-integration-token: ${{ secrets.SN_DEVOPS_INTEGRATION_TOKEN }}
          instance-url: ${{ secrets.SN_INSTANCE_URL }}
          tool-id: ${{ secrets.SN_ORCHESTRATION_TOOL_ID }}
          context-github: ${{ toJSON(github) }}
          job-name: 'Deploy'
          change-request: '{"setCloseCode":"true","attributes":{"chg_model":"007c4001c343101035ae3f52c1d3aeb2","type":"normal","short_description":"POC - automated deployment from GitHub","description":"Change created by GitHub Actions for Change Velocity POC","implementation_plan":"Automated deploy via GitHub Actions","backout_plan":"Redeploy previous version","test_plan":"Build job passed"}}'
          interval: '100'
          timeout: '3600'
          changeCreationTimeOut: '3600'
          abortOnChangeCreationFailure: true

      - name: Deploy
        run: echo "Deploying under change ${{ steps.create.outputs.change-request-number }}"
